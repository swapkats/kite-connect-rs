[package]
name = "kite-connect"
version = "0.3.0"
edition = "2021"
description = "Modern async Rust client for Kite Connect API"
license = "MIT"
repository = "https://github.com/swapkats/kite-connect-rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
base64 = "0.22"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
byteorder = "1"
